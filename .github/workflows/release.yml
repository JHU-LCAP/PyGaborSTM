name: Release

on:
  push:
    tags: ["v*"]

# Default-deny. id-token: write exists only on the two publish jobs, so no
# other job here can mint a PyPI credential.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release in flight: a cancellation between the TestPyPI and
  # PyPI publishes leaves it half-published, and the version cannot be reused.
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  # A tag push starts this workflow independently of CI, so without this gate
  # a commit with failing tests, lint or packaging guards can still publish.
  require-ci:
    name: Require CI green on the tagged commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for CI on ${{ github.sha }} and require success
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 60); do
            STATUS=$(gh run list --repo "$REPO" --commit "$SHA" \
                       --workflow ci.yml --limit 1 \
                       --json status,conclusion --jq '.[0].status // "missing"')
            CONCLUSION=$(gh run list --repo "$REPO" --commit "$SHA" \
                       --workflow ci.yml --limit 1 \
                       --json status,conclusion --jq '.[0].conclusion // ""')
            echo "attempt ${attempt}: status=${STATUS} conclusion=${CONCLUSION}"
            if [ "$STATUS" = "completed" ]; then
              [ "$CONCLUSION" = "success" ] && exit 0
              echo "::error::CI concluded '${CONCLUSION}' for ${SHA}; refusing to publish"
              exit 1
            fi
            sleep 30
          done
          echo "::error::timed out waiting for CI on ${SHA}"
          exit 1

  build:
    name: Build and verify the tag
    needs: require-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packaging for the version check
        run: pip install --upgrade "packaging>=24"

      - name: Tag must match [project].version
        id: meta
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, pathlib, re, sys, tomllib

          version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]

          if tag != f"v{version}":
              sys.exit(
                  f"tag {tag!r} does not match [project].version {version!r}. "
                  f"Expected 'v{version}'. Bump the version or retag; do not "
                  f"publish a mismatch."
              )

          # CITATION.cff is bumped by hand too, and a stale one is what
          # people end up citing.
          cff = pathlib.Path("CITATION.cff").read_text(encoding="utf-8")
          cited = re.search(r"^version:\s*(\S+)\s*$", cff, re.M)
          if cited is None or cited.group(1) != version:
              sys.exit(
                  f"CITATION.cff version is "
                  f"{cited.group(1) if cited else 'missing'}, [project].version "
                  f"is {version!r}. Bump CITATION.cff before tagging."
              )

          # Between releases pyproject carries X.Y.Z.dev0. Tagging one of those
          # would publish a development version to PyPI, permanently.
          from packaging.version import Version

          parsed = Version(version)
          if parsed.is_devrelease or parsed.is_prerelease:
              sys.exit(
                  f"version {version!r} is a development or pre-release. "
                  f"Set [project].version to a final release before tagging."
              )
          print(f"version={version}")
          PY

      # PyPI reserves a version permanently, and deleting a release does not
      # free it. Catch a forgotten version bump here rather than after the
      # TestPyPI upload has already spent the number.
      - name: Version must not already exist on PyPI
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Only real PyPI is fatal. TestPyPI holding this version is the
          # normal state after a release that got partway and was retried;
          # the publish step uses skip-existing precisely so a retry works.
          # Blocking on it makes every recoverable failure unrecoverable.
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
                   "https://test.pypi.org/pypi/pygaborstm/${VERSION}/json")
          case "$CODE" in
            404) echo "test.pypi.org: ${VERSION} is free" ;;
            200) echo "::warning::test.pypi.org already has ${VERSION}; the "\
                      "publish step will skip it and the smoke test will "\
                      "verify the existing artifact matches this build." ;;
            *)   echo "::warning::test.pypi.org returned HTTP ${CODE}" ;;
          esac

          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
                   "https://pypi.org/pypi/pygaborstm/${VERSION}/json")
          case "$CODE" in
            404) echo "pypi.org: ${VERSION} is free" ;;
            200) echo "::error::pypi.org already has pygaborstm ${VERSION}."
                 echo "::error::Versions are permanent; bump pyproject.toml and retag."
                 exit 1 ;;
            *)   echo "::error::pypi.org returned HTTP ${CODE} for ${VERSION}"
                 exit 1 ;;
          esac

      - name: Build
        run: |
          python -m pip install --upgrade pip build "twine>=6.1"
          python -m build

      - run: twine check --strict dist/*

      # Recorded as a file, not just prose, so the smoke job can prove the
      # bytes it installs from TestPyPI are the bytes being promoted.
      # Kept outside dist/, which the publish action uploads wholesale.
      - name: Record artifact hashes
        run: |
          (cd dist && sha256sum ./*) > SHA256SUMS
          {
            echo "### Artifacts for ${GITHUB_REF_NAME}"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: hashes
          path: SHA256SUMS
          if-no-files-found: error

      # Built once. Both publish jobs download this artifact, so what PyPI
      # receives is byte-identical to what was smoke-tested.
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pygaborstm/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI permanently reserves a filename it has seen. Without this,
          # any failure downstream costs a version number that can never be
          # reused. Deliberately absent on the real PyPI job below.
          skip-existing: true
          print-hash: true

      - uses: actions/download-artifact@v7
        with:
          name: hashes

      # skip-existing means TestPyPI may hold an OLDER build of some file for
      # this version. The smoke jobs only download the wheel, so a stale sdist
      # would never be compared, yet the current sdist would still be promoted
      # to PyPI. Compare every artifact we are about to promote against what
      # TestPyPI actually serves.
      - name: Every artifact on TestPyPI matches the build being promoted
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python - <<'PY'
          import json, os, sys, time, urllib.request

          version = os.environ["VERSION"]
          built = {}
          for line in open("SHA256SUMS", encoding="utf-8"):
              digest, name = line.split()
              built[name.lstrip("./")] = digest

          url = f"https://test.pypi.org/pypi/pygaborstm/{version}/json"
          served = None
          for attempt in range(8):
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      data = json.load(r)
                  served = {u["filename"]: u["digests"]["sha256"] for u in data["urls"]}
                  if set(built) <= set(served):
                      break
              except Exception as exc:
                  print(f"attempt {attempt + 1}: {exc}")
              time.sleep(20)

          if served is None:
              sys.exit("could not read the TestPyPI file list")

          bad = []
          for name, digest in built.items():
              if name not in served:
                  bad.append(f"{name}: not on TestPyPI")
              elif served[name] != digest:
                  bad.append(f"{name}: TestPyPI has {served[name][:12]}, built {digest[:12]}")
          if bad:
              print("::error::TestPyPI does not hold the artifacts being promoted:")
              for b in bad:
                  print(f"::error::  {b}")
              print("::error::A stale upload is being served; bump the version rather than promote it.")
              sys.exit(1)
          for name in built:
              print(f"ok  {name}")
          PY

  smoke-testpypi:
    name: Install from TestPyPI (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: [build, publish-testpypi]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Every supported platform and Python: this is the last gate before a
        # version number is spent permanently.
        os: [ubuntu-latest, macos-14, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # --extra-index-url is required: numpy, scipy and matplotlib are not on
      # TestPyPI in usable versions, so a TestPyPI-only index cannot resolve.
      # pip does not prefer the primary index, it unions them and takes the
      # best version, which is why the version is pinned with ==. The retry
      # covers TestPyPI's index cache, routinely a minute behind an upload.
      - uses: actions/download-artifact@v7
        with:
          name: hashes

      # Download first and check the hash, rather than installing blind.
      # skip-existing means TestPyPI may already hold a different build of
      # this version, in which case we would smoke test one artifact and
      # promote another.
      - name: Download from TestPyPI and verify it matches the built artifact
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m pip install --upgrade pip
          mkdir -p fetched
          for attempt in 1 2 3 4 5 6; do
            if pip download --no-deps --no-cache-dir --dest fetched \
                 --index-url https://test.pypi.org/simple/ \
                 "pygaborstm==${VERSION}"; then
              break
            fi
            echo "::notice::TestPyPI index has not caught up (attempt ${attempt}/6); retrying"
            sleep 20
            if [ "$attempt" = "6" ]; then
              echo "::error::could not download pygaborstm==${VERSION} from TestPyPI"
              exit 1
            fi
          done
          FETCHED=$(ls fetched/pygaborstm-*)
          echo "fetched: ${FETCHED}"
          GOT=$(python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$FETCHED")
          WANT=$(grep -F "$(basename "$FETCHED")" SHA256SUMS | cut -d' ' -f1)
          if [ -z "$WANT" ]; then
            echo "::error::$(basename "$FETCHED") is not in the built SHA256SUMS"
            exit 1
          fi
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::TestPyPI artifact does not match the one being promoted"
            echo "  fetched: ${GOT}"
            echo "  built:   ${WANT}"
            exit 1
          fi
          echo "hash matches the artifact that will go to PyPI"

      # Install the verified file itself; dependencies still resolve from real
      # PyPI, because numpy/scipy/matplotlib are not usable on TestPyPI.
      - name: Install the verified artifact
        run: |
          FETCHED=$(ls fetched/pygaborstm-*)
          pip install --no-cache-dir "${FETCHED}[viz]"

      # Not from the repo root: there, ./pygaborstm/ shadows the installed
      # distribution and this job would pass against an empty wheel. Only
      # scripts/ is checked out, and the script itself refuses to run against
      # a source tree.
      - name: Smoke test the installed distribution
        working-directory: ${{ runner.temp }}
        env:
          EXPECT_VERSION: ${{ needs.build.outputs.version }}
          SMOKE: ${{ github.workspace }}/scripts/smoke_install.py
          MPLBACKEND: Agg
        run: python "$SMOKE"

  publish-pypi:
    name: Publish to PyPI
    needs: [build, smoke-testpypi]
    runs-on: ubuntu-latest
    # The required-reviewer rule on this environment IS the approval gate. The
    # workflow only names the environment; if the reviewer list is empty there
    # is no pause and a tag publishes straight through.
    environment:
      name: pypi
      url: https://pypi.org/project/pygaborstm/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Show the hashes being promoted
        run: |
          {
            echo "### Promoting to PyPI"
            echo '```'
            sha256sum dist/*
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
          # No skip-existing here. A duplicate filename on real PyPI means the
          # release logic is confused; stop rather than silently succeed.

  github-release:
    name: GitHub Release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history: the commit list below needs it, and the default depth 1
      # has nothing to log.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      # The generated notes give PR titles grouped by label (see
      # .github/release.yml). They cannot be combined with --notes, so fetch
      # them from the API and append the commit list, which is what makes a
      # release traceable to exact commits rather than just PR numbers.
      - name: Build release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The baseline is the last *published release*, not merely the
          # nearest tag. A tag pattern cannot tell a real release from an
          # experiment or a failed attempt, and picking one of those silently
          # truncates the changelog to "since that tag".
          PREV=$(gh release list --repo "${REPO}" --limit 100 \
                   --json tagName,isDraft,isPrerelease,createdAt \
                   --jq '[.[] | select(.isDraft==false and .isPrerelease==false)
                          | .tagName] | map(select(. != "'"${TAG}"'")) | .[0]' \
                 2>/dev/null || true)
          # Fall back to tag order only if the API gave nothing, and require a
          # numeric version so 'v-experiment' cannot be chosen.
          if [ -z "$PREV" ]; then
            PREV=$(git describe --tags --abbrev=0 --match='v[0-9]*' "${TAG}^" 2>/dev/null || true)
          fi
          if [ -n "$PREV" ]; then
            echo "previous tag: ${PREV}"
            RANGE="${PREV}..${TAG}"
            GENERATED=$(gh api --method POST "repos/${REPO}/releases/generate-notes" \
              -f tag_name="${TAG}" -f previous_tag_name="${PREV}" --jq .body)
          else
            echo "no previous tag; listing all commits"
            RANGE="${TAG}"
            GENERATED=$(gh api --method POST "repos/${REPO}/releases/generate-notes" \
              -f tag_name="${TAG}" --jq .body)
          fi

          # A hand-written summary leads, if there is one. The generated PR
          # and commit lists go underneath, collapsed: a release page that
          # opens with every PR since the repo began describes how the repo
          # was built, not what the release does.
          # Python, not sed: a single-line <!-- comment --> makes a sed range
          # start and never close, deleting the rest of the file. That silently
          # ate the whole summary.
          python - <<'STRIP' > SUMMARY.md
          import pathlib, re
          raw = pathlib.Path(".github/RELEASE_NOTES.md").read_text(encoding="utf-8", errors="replace")
          print(re.sub(r"<!--.*?-->", "", raw, flags=re.S).strip())
          STRIP
          SUMMARY=$(tr -d '[:space:]' < SUMMARY.md)

          {
            if [ -n "$SUMMARY" ]; then
              cat SUMMARY.md
              echo
              echo "<details><summary>All changes</summary>"
              echo
            else
              echo "::warning::.github/RELEASE_NOTES.md is empty; using generated notes only" >&2
            fi

            echo "$GENERATED"
            echo
            echo "### Commits"
            echo
            git log --no-merges --format='- `%h` %s' "$RANGE"
            echo
            echo "Released from \`$(git rev-parse HEAD)\`."

            if [ -n "$SUMMARY" ]; then
              echo
              echo "</details>"
            fi
          } > NOTES.md

          # GitHub rejects bodies past ~125k characters, and this step runs
          # after PyPI has already accepted the upload, so truncate rather
          # than fail the release.
          if [ "$(wc -c < NOTES.md)" -gt 100000 ]; then
            head -c 100000 NOTES.md > NOTES.trunc
            printf '\n\n_Notes truncated; see the full compare link above._\n' >> NOTES.trunc
            mv NOTES.trunc NOTES.md
            echo "::warning::release notes truncated to fit GitHub's limit"
          fi

          echo "--- notes ---"
          cat NOTES.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file NOTES.md \
            --verify-tag
