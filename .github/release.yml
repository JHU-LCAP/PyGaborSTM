# Groups GitHub's auto-generated release notes by PR label.
# The "*" catch-all is load-bearing: without it an unlabelled PR is dropped
# from the notes entirely rather than just being uncategorised.
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: Features
      labels:
        - enhancement
    - title: Bug Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Other Changes
      labels:
        - "*"
