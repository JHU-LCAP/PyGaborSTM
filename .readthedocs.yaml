# Read the Docs build configuration.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Installs the package itself with its `viz` extra, because mkdocstrings
# resolves pygaborstm.plot and pygaborstm.analysis, which need matplotlib.
# Doc tooling stays in docs/requirements.txt.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - viz
    - requirements: docs/requirements.txt
